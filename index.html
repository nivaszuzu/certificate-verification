<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zuzu Beauty Studio - Certificate Verification</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
min-height:100vh;
padding:20px;
color:white;
overflow-x:hidden;

background:
linear-gradient(
rgba(43,11,95,.25),
rgba(75,31,131,.20),
rgba(43,11,95,.25)
),
url("bg.png");

background-size:cover;
background-position:center;
background-repeat:no-repeat;
background-attachment:fixed;
}

body::before{
content:"";
position:fixed;
inset:0;
background:url("bg.png") center center no-repeat;
background-size:cover;
opacity:.70;
z-index:-2;
}

body::after{
content:"";
position:fixed;
inset:0;
background:linear-gradient(
135deg,
rgba(43,11,95,.12),
rgba(75,31,131,.10),
rgba(43,11,95,.12)
);
z-index:-1;
}

.container{
max-width:900px;
margin:auto;
}

.logo{
text-align:center;
margin-top:20px;
}

.logo img{
width:130px;
height:auto;
filter:drop-shadow(0 0 15px rgba(255,216,107,.45));
}

.brand{
text-align:center;
margin-top:12px;
}

.brand h1{
font-size:3rem;
font-weight:700;
}

.brand p{
letter-spacing:8px;
font-style:italic;
margin-top:8px;
opacity:.85;
}

.title{
text-align:center;
margin-top:45px;
font-size:2rem;
color:#ffd86b;
font-weight:bold;
}

.subtitle{
text-align:center;
margin-top:10px;
opacity:.85;
}

.search-box{
margin-top:35px;
display:flex;
gap:12px;
}

.search-box input{

flex:1;
padding:18px 20px;
border:none;
border-radius:14px;
font-size:18px;
outline:none;
text-transform:uppercase;
transition:.25s;

}

.search-box input:focus{

box-shadow:0 0 0 3px rgba(255,216,107,.4);

}

.search-box button{

padding:18px 30px;
border:none;
border-radius:14px;
background:#ffd86b;
color:#2b0b5f;
font-weight:700;
cursor:pointer;
transition:.25s;

}

.search-box button:hover{

transform:translateY(-2px);
background:#ffca45;
box-shadow:0 10px 25px rgba(0,0,0,.3);

}

.result-card{

display:none;
margin-top:40px;
background:rgba(255,255,255,.95);
backdrop-filter:blur(18px);
padding:35px;
border-radius:25px;
color:#222;
box-shadow:0 20px 60px rgba(0,0,0,.35);

}

.verified{

text-align:center;
font-size:30px;
font-weight:bold;
color:#00a651;
margin-bottom:25px;

}

.info{

display:grid;
grid-template-columns:1fr 1fr;
gap:20px;

}

.info-item{

background:#f5f5f5;
padding:16px;
border-radius:12px;

}

.label{

font-size:13px;
color:#777;
margin-bottom:6px;

}

.value{

font-size:18px;
font-weight:600;

}

.status{

margin-top:25px;
padding:16px;
background:#e8f5e9;
border-radius:12px;
font-size:18px;
font-weight:bold;
text-align:center;
color:#0b8c43;

}

.notfound{

display:none;
margin-top:35px;
background:#ffebee;
color:#d32f2f;
padding:20px;
border-radius:15px;
text-align:center;
font-weight:bold;

}

.footer{

margin-top:55px;
text-align:center;
opacity:.75;

}

@media(max-width:700px){

.brand h1{
font-size:2rem;
}

.title{
font-size:1.5rem;
}

.search-box{
flex-direction:column;
}

.info{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<div class="container">

<div class="logo">
<img src="seal.png" alt="Zuzu Beauty Studio">
</div>

<div class="brand">
<h1>Zuzu Beauty Studio</h1>
<p>The Beauty Expert</p>
</div>

<div class="title">
CERTIFICATE VERIFICATION
</div>

<div class="subtitle">
Verify student certificates issued by Zuzu Beauty Studio
</div>

<div class="search-box">

<input
type="text"
id="cert"
placeholder="Enter Certificate Number">

<button onclick="verifyCert()">
VERIFY
</button>

</div>

<div class="notfound" id="notfound">
❌ Certificate Not Found
</div>

<div class="result-card" id="resultCard">

<div class="verified">
✅ CERTIFICATE VERIFIED
</div>

<div class="info">

<div class="info-item">
<div class="label">Student Name</div>
<div class="value" id="name"></div>
</div>

<div class="info-item">
<div class="label">Course</div>
<div class="value" id="course"></div>
</div>

<div class="info-item">
<div class="label">Certificate Number</div>
<div class="value" id="certno"></div>
</div>

<div class="info-item">
<div class="label">Issue Year</div>
<div class="value" id="date"></div>
</div>

</div>

<div class="status">
✅ Certificate Status : VALID
</div>

</div>

<div class="footer">
© 2026 Zuzu Beauty Studio • Sivakasi
</div>

</div>

<script>

let students=[];

fetch("students.json")
.then(response=>response.json())
.then(data=>{
students=data;
})
.catch(error=>{
console.error(error);
});

document.getElementById("cert").addEventListener("keypress",function(e){

if(e.key==="Enter"){

verifyCert();

}

});

function verifyCert(){

let cert=document.getElementById("cert").value.trim().toUpperCase();

if(cert==""){

alert("Please enter certificate number.");

return;

}
let student=students.find(
s=>s.cert.toUpperCase()===cert
);

document.getElementById("resultCard").style.display="none";
document.getElementById("notfound").style.display="none";

if(student){

document.getElementById("name").innerText=student.name;
document.getElementById("course").innerText=student.course;
document.getElementById("certno").innerText=student.cert;
document.getElementById("date").innerText=student.year;

document.getElementById("resultCard").style.display="block";

}else{

document.getElementById("notfound").style.display="block";

}

}

</script>

</body>
</html>
